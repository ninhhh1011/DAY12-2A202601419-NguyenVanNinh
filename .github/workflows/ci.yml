name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest tests --ignore=tests/test_cp5.py --ignore=tests/test_bonus_cicd.py -m "not docker"
        env:
          AGENT_API_KEY: ci-dummy
          REDIS_URL: fake://

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: docker build -t day12-agent:ci .

  deploy:
    needs: [test, build]
    # ponytail: deploy activates once Railway variables are configured; local fallback remains valid.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.RAILWAY_SERVICE != '' && vars.PUBLIC_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: npm install -g @railway/cli@5.35.0
      - run: |
          test -n "$RAILWAY_TOKEN"
          railway up --ci --service "$RAILWAY_SERVICE"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
      - name: Smoke test
        run: >
          curl --fail --show-error --silent --retry 6 --retry-all-errors
          --retry-delay 5 --retry-max-time 60 --connect-timeout 10 --max-time 15
          "${{ vars.PUBLIC_URL }}/health"
