name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest tests --ignore=tests/test_cp5.py --ignore=tests/test_bonus_cicd.py -m "not docker"
        env:
          AGENT_API_KEY: ci-dummy
          REDIS_URL: fake://

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t day12-agent:ci .

  deploy:
    needs: [test, build]
    # ponytail: deploy activates once Railway variables are configured; local fallback remains valid.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.RAILWAY_SERVICE != '' && vars.PUBLIC_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g @railway/cli
      - run: railway up --service "${{ vars.RAILWAY_SERVICE }}" --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      - run: curl -fsS "${{ vars.PUBLIC_URL }}/health"
